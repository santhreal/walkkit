[workspace]
members = ["."]

[workspace.dependencies]
crossbeam-channel = "=0.5.15"
globset = "=0.4.18"
ignore = "=0.4.25"
md5 = "=0.8.0"
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.18"
zstd = { version = "=0.13.3", default-features = false }
criterion = "=0.5.1"
proptest = "=1.9.0"
tempfile = "=3.27.0"

[package]
name = "walkkit"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/santhreal/walkkit"
homepage = "https://github.com/santhreal/walkkit"
documentation = "https://docs.rs/walkkit"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
rust-version = "1.85"
description = "Parallel filesystem walker with ignore-aware traversal and bounded work queues"
readme = "README.md"
keywords = ["filesystem", "walker", "parallel", "ignore", "traversal"]
categories = ["filesystem", "concurrency"]

[package.metadata.santh]
status = "stable"

[dependencies]
crossbeam-channel.workspace = true
hashkit = { version = "0.1.1" }
flate2 = { version = "=1.1.9", optional = true }
globset = { version = "=0.4.18" }
ignore = { version = "=0.4.25" }
md5 = { version = "=0.8.0" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror.workspace = true
tokio = { version = "=1.52.3", features = ["process", "time", "fs"] }
toml = "=0.8.23"
tracing = "=0.1.44"
url = "=2.5.8"
zstd = { version = "=0.13.3", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["gitignore"]
archive = ["gzip", "zstd", "zip-deflate"]
gitignore = []
gzip = ["dep:flate2"]
zip-deflate = ["dep:flate2"]
zstd = ["dep:zstd"]

[dev-dependencies]
criterion = { version = "0.5.1" }
proptest = { version = "1.9.0" }
tempfile.workspace = true

[[bench]]
name = "walk_bench"
harness = false

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial/mod.rs"

[[test]]
name = "concurrent"
path = "tests/concurrent/mod.rs"

[[test]]
name = "property"
path = "tests/property/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[[test]]
name = "regression"
path = "tests/regression/mod.rs"

[[test]]
name = "test_depth_unit"
path = "tests/unit/test_depth_unit.rs"

[[test]]
name = "test_depth_adversarial"
path = "tests/adversarial/test_depth_adversarial.rs"

[[test]]
name = "test_depth_property"
path = "tests/property/test_depth_property.rs"

[[test]]
name = "test_depth_gap"
path = "tests/unit/test_depth_gap.rs"

[[test]]
name = "core_tests"
path = "tests/unit/core_tests.rs"

[[test]]
name = "break_it"
path = "tests/adversarial/break_it.rs"

[[test]]
name = "adversarial_break_it_mod"
path = "tests/adversarial/break_it_mod_harness.rs"

[[test]]
name = "adversarial_audit"
path = "tests/adversarial/adversarial_audit.rs"

[[test]]
name = "unit_mass_walk_samples"
path = "tests/unit/mass_walk_samples.rs"

[[test]]
